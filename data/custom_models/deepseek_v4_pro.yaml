name: "deepseek-ai/DeepSeek-V4-Pro"
profiling_model: "meta-llama/Meta-Llama-3-70B"

# Architecture (estimates based on public info; verify from PDF table)
# head_dim=512 confirmed; 16 heads × 512 = 8192 embedding_dim
num_layers: 61
num_q_heads: 16
num_kv_heads: 16
embedding_dim: 8192
mlp_hidden_dim: 18432
max_position_embeddings: 1000000

use_gated_mlp: true
use_bias: false
use_qkv_bias: false
activation: silu
norm: rms_norm
post_attn_norm: true
vocab_size: 129280
rope_theta: 10000

# MoE: 384 routed experts, 6 active per token, 1 shared
is_moe: true
num_routed_experts: 384
num_experts_per_tok: 6
num_shared_experts: 1
moe_intermediate_size: 2048

# Hybrid CSA+HCA attention (replaces MLA from V3)
# CSA: chunk_size=64 → KV cache ≈ 1/64 of MHA per layer
# HCA: chunk_size=1024 → KV cache ≈ 1/1024 of MHA per layer
# Interleaved: avg KV ≈ 10% of MHA at 1M context (matches paper)
attention_type: "HYBRID_CSA_HCA"
csa_chunk_size: 64
csa_top_k: 16
hca_chunk_size: 1024

# mHC hyper-connections: 4 parallel residual streams
n_hc: 4
