# Example: custom 34B MoE model with GQA and 64 routed experts
#
# Usage:
#   python -m vidur.main \
#     --replica_config_device a100 \
#     --replica_config_model_config_yaml data/custom_models/example_moe_34b.yaml \
#     --execution_time_predictor_config_type moe \
#     ...
#
# For MoE models the simulator computes router/expert times analytically
# from the architecture params below, so profiling_model only needs to
# match for attention and dense-MLP base timing.

name: "myorg/custom-moe-34b"
profiling_model: "meta-llama/Meta-Llama-3-8B"

# ── Architecture ──────────────────────────────────────────────────────────────
num_layers: 60
num_q_heads: 32
num_kv_heads: 8          # GQA
embedding_dim: 4096
mlp_hidden_dim: 14336    # dense FFN hidden dim (unused for MoE layers)
max_position_embeddings: 32768
vocab_size: 128256

# ── MLP / norm style ──────────────────────────────────────────────────────────
use_gated_mlp: true
use_bias: false
use_qkv_bias: false
activation: silu
norm: rms_norm
post_attn_norm: true

# ── Positional encoding ───────────────────────────────────────────────────────
rope_theta: 500000.0

# ── MoE ───────────────────────────────────────────────────────────────────────
is_moe: true
num_routed_experts: 64
num_experts_per_tok: 4   # active experts per token per layer
num_shared_experts: 1    # always-active shared expert (0 to disable)
moe_intermediate_size: 2048   # expert FFN hidden dim
